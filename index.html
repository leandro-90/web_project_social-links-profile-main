<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>
  <style>
    body {
      background-color: #141414;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      height: 100vh;
    }

    .boxCenter {
      background-color: #1f1f1f;
      padding: 10px;
      border-radius: 20px;
      margin: auto;
    }

    img {
      border-radius: 50%;
      width: 40%;
    }

    h1 {
      margin-bottom: 0;
    }

    .location {
      color: #c5f82a;
    }

    .description {
      margin: 30px 0 20px 0;
    }

    .button {
      display: flex;
      width: 300px;
      height: 40px;
      background-color: #333333;
      color: white;
      border-radius: 10px;
      margin: 10px;
      align-items: center;
      justify-content: center;
    }

    .button:hover {
      background-color: #c5f82a;
      color: black;
    }

    .attribution {
      font-size: 1em;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
      font-weight: 900;
    }
  </style>
</head>

<body>

  <div class="boxCenter">
    <img src="./images/avatar-jessica.jpeg">
    <h1>Jessica Randall</h1>
    <p class="location">London, United Kingdom</p>
    <p class="description">"Front-end developer and avid reader."</p>
    <div class="button" type="button">GitHub</div>
    <div class="button" type="button">Frontend Mentor</div>
    <div class="button" type="button">LinkedIn</div>
    <div class="button" type="button">Twitter</div>
    <div class="button" type="button">Instagram</div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/leandro-90" target="_blank">Leandro Ferreira</a>.
  </footer>
</body>

</html>
